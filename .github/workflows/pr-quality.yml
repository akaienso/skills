name: PR quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name is semantic
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # type/short-description, where type is a Conventional Commit type.
          # release-please's own release branch is the only other name allowed.
          if [[ "$BRANCH" =~ ^(feat|fix|chore|docs|refactor|test|ci|build|perf|revert|style)/[a-z0-9][a-z0-9._-]*$ ]] \
             || [ "$BRANCH" = "release-please--branches--main" ]; then
            echo "Branch name OK: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' is not a semantic name. Use type/short-description, for example feat/wordpress-skill or fix/acss-token-names."
            exit 1
          fi

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check the PR title is a Conventional Commit
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert

  validate-skills:
    name: validate-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every skill's front matter, links and scripts
        run: node scripts/validate-skills.mjs
      - name: Check the install script parses
        run: bash -n scripts/install.sh

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
